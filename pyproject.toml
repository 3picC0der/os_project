[project]
name = "vmsim"
version = "0.2.0"
description = "Virtual memory management simulator: page replacement and thrashing analysis (ICS 433)"
requires-python = ">=3.10"
dependencies = ["rich>=13", "matplotlib>=3.8"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
vmsim = "vmsim.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vmsim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
